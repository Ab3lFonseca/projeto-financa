# Fly.io — API. Veja docs/deploy.md (passo a passo e custos).
#   fly launch --no-deploy --copy-config      (primeira vez; troque o nome do app abaixo)
#   fly secrets set DATABASE_URL=... SUPABASE_URL=... (lista completa em docs/deploy.md)
#   fly deploy
app = "financa-api"          # TROQUE: precisa ser único no Fly
primary_region = "gru"       # São Paulo — mesma região do Supabase (sa-east-1) para baixa latência

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  TRUST_PROXY = "true"
  JOBS_ENABLED = "true"
  # Beta: todos têm recursos Premium. Mude para "true" quando ligar a cobrança.
  BILLING_ENFORCED = "false"
  OPEN_FINANCE_ENABLED = "false"
  # Segredos (DATABASE_URL, SUPABASE_*, IP_HASH_PEPPER, PLUGGY_*) vão por `fly secrets set`, nunca aqui.

[http_service]
  internal_port = 3000
  force_https = true
  # Os jobs (recorrências, lembretes, exclusões de conta) rodam DENTRO da API: ela não pode ser
  # desligada por falta de tráfego, senão lembretes e recorrências atrasam.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
