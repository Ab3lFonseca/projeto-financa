# Render (plano gratuito) — API + app web. Passo a passo e limitações: docs/deploy-render.md
#
# Como usar: Render → New → Blueprint → escolha este repositório. O Render lê este arquivo, cria os dois
# serviços e PERGUNTA os valores marcados com `sync: false` (segredos e endereços — nunca ficam no Git).
#
# Os nomes viram endereços públicos (https://NOME.onrender.com) e precisam ser únicos no Render:
# se "financa-api"/"financa-web" já estiverem em uso, troque aqui e use os novos endereços nas variáveis.
services:
  # ---------------------------------------------------------------- API (Fastify, imagem Docker)
  - type: web
    name: financa-api
    runtime: docker
    plan: free
    # Não existe região no Brasil; Virginia é a mais próxima das disponíveis (oregon, ohio, virginia, frankfurt, singapore).
    region: virginia
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Só publica depois que o CI do GitHub passar.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      # IP real do cliente para os limites de tentativas: o Render passa pelo Cloudflare, que escreve cf-connecting-ip e o cliente não
      # consegue forjar. Com isso o X-Forwarded-For (que o cliente controla) é ignorado; sem isso o limite de cadastro era burlável.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Os jobs rodam dentro da API; no plano gratuito ela "dorme" após 15 min sem tráfego (veja o guia).
      - key: JOBS_ENABLED
        value: "true"
      - key: BILLING_ENFORCED
        value: "false"
      # Ligue (true) depois de cadastrar PLUGGY_CLIENT_ID, PLUGGY_CLIENT_SECRET e o endereço de retorno web.
      - key: OPEN_FINANCE_ENABLED
        value: "false"
      - key: IP_HASH_PEPPER
        generateValue: true
      - key: PLUGGY_WEBHOOK_SECRET
        generateValue: true
      # Segredos e endereços (o Render pergunta ao criar):
      - key: DATABASE_URL # Supabase → Session pooler (porta 5432), com a senha
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # SECRETA: só no servidor
        sync: false
      - key: CORS_ORIGINS # endereço do app web abaixo, ex.: https://financa-web.onrender.com
        sync: false
      # Quem é administrador (ID da sua conta no Supabase → Authentication → Users → "User UID"; vários, separados por vírgula).
      # Fica só no painel do Render: o repositório é público e não deve registrar quem administra.
      - key: ADMIN_USER_IDS
        sync: false
      # Para onde o link do e-mail de confirmação leva: a tela /confirm-email do site. Também precisa estar em "Redirect URLs" no Supabase.
      - key: EMAIL_CONFIRM_WEB_REDIRECT_URL # ex.: https://financa-web.onrender.com/confirm-email
        sync: false

  # ---------------------------------------------------------------- App web (Expo, site estático)
  - type: web
    name: financa-web
    runtime: static
    # O primeiro trecho falha o build (com mensagem clara) se EXPO_PUBLIC_API_URL não estiver definida neste site; sem isso o
    # site sairia apontando para http://localhost:3000. O endereço usado aparece no log do build.
    buildCommand: >-
      test -n "$EXPO_PUBLIC_API_URL" || { echo "ERRO: a variavel EXPO_PUBLIC_API_URL nao esta definida neste site (aba Environment)"; exit 1; } &&
      echo "API usada pelo site: $EXPO_PUBLIC_API_URL" &&
      npx --yes pnpm@12.9.1 install --frozen-lockfile --filter "@app/mobile..." &&
      npx --yes pnpm@12.9.1 --filter @app/mobile exec expo export --platform web
    staticPublishPath: apps/mobile/dist
    # App de página única: qualquer caminho cai no index.html (o expo-router resolve a rota no navegador).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeçalhos de segurança do site (a API já manda os dela; o HTML do site é servido pelo Render e precisa dos seus). Só as
    # diretivas seguras estão aplicadas; uma CSP completa (script-src etc.) deve ser testada antes, por causa do widget do Pluggy.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
    # O Node (24) vem do .nvmrc da raiz. O build usa `npx pnpm@...` porque o Render não deixa instalar pacotes globais
    # (`npm install -g` falha com "read-only file system").
    envVars:
      - key: EXPO_NO_TELEMETRY
        value: "1"
      # Embutida no app na hora do build: mudou o endereço da API? Faça um novo deploy deste serviço.
      - key: EXPO_PUBLIC_API_URL # ex.: https://financa-api.onrender.com (sem barra no final)
        sync: false
