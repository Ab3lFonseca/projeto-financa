name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      # Os testes de API usam Postgres embutido; os de banco usam PGlite. Não precisam de serviços externos.
      - run: pnpm test
      - run: pnpm --filter @app/api build

  docker:
    name: Imagem Docker da API
    runs-on: ubuntu-latest
    needs: verify
    # Postgres de verdade e vazio: a imagem precisa criar o banco inteiro sozinha, só ao iniciar (é o que acontece a cada deploy).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: financa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          load: true
          tags: financa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: A imagem aplica as migrations sozinha num banco vazio e a API sobe
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=test -e PORT=3055 -e HOST=127.0.0.1 \
            -e DATABASE_URL=postgresql://postgres:ci@127.0.0.1:5432/financa \
            -e JOBS_ENABLED=false -e RATE_LIMIT_ENABLED=false \
            financa-api:ci
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3055/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs api
          test "$code" = "200"
          expected=$(ls packages/database/prisma/migrations | grep -c '^[0-9]')
          applied=$(docker run --rm --network host postgres:17 psql "postgresql://postgres:ci@127.0.0.1:5432/financa" -tAc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null" | tr -d '[:space:]')
          echo "migrations no repositório=$expected aplicadas no banco=$applied"
          test "$expected" = "$applied"
      - name: Reiniciar não reaplica nada (idempotente)
        run: |
          docker restart api
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3055/ready || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs api 2>&1 | tail -n 15
          test "$code" = "200"
          docker logs api 2>&1 | grep -q "No pending migrations to apply"
      - name: Se o banco não responde, o contêiner sai com erro (a API não sobe sem poder migrar)
        run: |
          docker rm -f api2 >/dev/null 2>&1 || true
          set +e
          docker run --name api2 --network host -e NODE_ENV=test -e PORT=3056 -e HOST=127.0.0.1 \
            -e DATABASE_URL=postgresql://postgres:ci@127.0.0.1:5999/financa \
            -e MIGRATE_TIMEOUT_SECONDS=60 financa-api:ci
          status=$?
          set -e
          echo "código de saída: $status"
          test "$status" != "0"
